row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\nbutton{font:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\nbutton[aria-pressed=\"true\"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}\n:focus-visible{outline:3px solid var(--force);outline-offset:2px}\nlabel{display:block;font-size:15px}input[type=range]{width:100%;min-height:36px;accent-color:var(--force)}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}\n.f{font:600 22px/1.3 \"Iowan Old Style\",Palatino,Georgia,serif}\n.ok{color:var(--force);font-weight:600}\nul{margin:0;padding-left:20px}li.p{border:0;padding:0;white-space:normal;color:var(--ink);font-size:16px;margin-bottom:6px;border-radius:0}\n<\/style>\n<\/head>\n<body>\n<main>\n\n<h1>Elektrický náboj<\/h1>\n<p>Klepni do plochy a přidáš náboj, přetažením ho posuneš. Šipky ukazují sílu, kterou na každý náboj působí ostatní.<\/p>\n<canvas id=\"stage\" role=\"img\" aria-label=\"Plocha s elektrickými náboji a silami mezi nimi\"><\/canvas>\n<div class=\"row\">\n<button id=\"bp\" aria-pressed=\"true\">+ kladný<\/button>\n<button id=\"bn\" aria-pressed=\"false\">− záporný<\/button>\n<button id=\"fl\">Obrátit vybraný<\/button>\n<button id=\"del\">Smazat vybraný<\/button>\n<button id=\"mv\" aria-pressed=\"false\">Nechat pohybovat<\/button>\n<button id=\"rs\">Začít znovu<\/button>\n<\/div>\n<label>Velikost vybraného náboje: <b id=\"qv\">3<\/b> µC<input id=\"size\" type=\"range\" min=\"1\" max=\"10\" step=\"0.5\" value=\"3\"><\/label>\n\n<section class=\"card\">\n<h2>Coulombův zákon<\/h2>\n<p class=\"f\">F = k · |q₁ · q₂| / r²<\/p>\n<p id=\"pair\"><\/p>\n<p id=\"net\" class=\"mute\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Úkol: postav rovnováhu<\/h2>\n<p>Dej na plochu aspoň tři náboje tak, aby výsledná síla na vybraný náboj klesla téměř k nule (stačí pod 40 % největší dílčí síly).<\/p>\n<p id=\"task\" class=\"mute\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Co si odnést<\/h2>\n<ul>\n<li class=\"p\">Stejná znaménka se odpuzují, opačná se přitahují.<\/li>\n<li class=\"p\">Dvojnásobná vzdálenost znamená čtvrtinovou sílu, protože ve vzorci je r². Zkus odtáhnout náboj od druhého.<\/li>\n<li class=\"p\">Náboj nevzniká z ničeho ani nemizí, jen se přesouvá. Nejmenší kousek nese elektron: e = 1,602 × 10⁻¹⁹ C.<\/li>\n<\/ul>\n<p class=\"mute\" id=\"sum\" style=\"margin-top:8px\"><\/p>\n<\/section>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id),cv=$('stage'),cx=cv.getContext('2d');\nconst K=8.99e9,MM=1e-3,DMIN=14; // 1 px = 1 mm\nlet W=0,H=0,sign=1,sel=0,moving=false,drag=null,ch=[];\nconst col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst fmt=n=>n.toLocaleString('cs-CZ',{maximumFractionDigits:n<10?2:n<100?1:0});\nconst sup=n=>String(n).replace(/\\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);\nconst rad=c=>11+Math.abs(c.q)*1.3, sg=q=>q>0?'+':'−';\nfunction resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);\n if(!ch.length)reset();ch.forEach(c=>{c.x=Math.min(W-14,c.x);c.y=Math.min(H-14,c.y)})}\nfunction reset(){ch=[{x:.33*W,y:.5*H,q:3,vx:0,vy:0},{x:.67*W,y:.5*H,q:-3,vx:0,vy:0}];sel=0;sync()}\nfunction sync(){$('size').value=Math.abs(ch[sel].q)}\nfunction forces(){return ch.map((a,i)=>{let fx=0,fy=0;ch.forEach((b,j)=>{if(i==j)return;const dx=a.x-b.x,dy=a.y-b.y,d=Math.max(Math.hypot(dx,dy),DMIN),F=K*a.q*b.q*1e-12/(d*MM)**2;fx+=F*dx/d;fy+=F*dy/d});return[fx,fy]})}\nfunction nearest(s){let o=null,m=1e9;ch.forEach(c=>{if(c!==s){const d=Math.hypot(c.x-s.x,c.y-s.y);if(d<m){m=d;o=c}}});return o}\nfunction step(dt){const f=forces();ch.forEach((c,i)=>{if(c===drag)return;\n c.vx=(c.vx+f[i][0]*400*dt)*.985;c.vy=(c.vy+f[i][1]*400*dt)*.985;const s=Math.hypot(c.vx,c.vy);if(s>500){c.vx*=500/s;c.vy*=500/s}\n c.x+=c.vx*dt;c.y+=c.vy*dt;\n if(c.x<14||c.x>W-14){c.vx*=-.5;c.x=Math.min(W-14,Math.max(14,c.x))}\n if(c.y<14||c.y>H-14){c.vy*=-.5;c.y=Math.min(H-14,Math.max(14,c.y))}})}\nfunction arrow(x,y,dx,dy,color){const l=Math.hypot(dx,dy);if(l<3)return;cx.strokeStyle=cx.fillStyle=color;cx.lineWidth=3;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+dx,y+dy);cx.stroke();\n const a=Math.atan2(dy,dx),X=x+dx,Y=y+dy;cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X-10*Math.cos(a-.4),Y-10*Math.sin(a-.4));cx.lineTo(X-10*Math.cos(a+.4),Y-10*Math.sin(a+.4));cx.fill()}\nfunction draw(){cx.clearRect(0,0,W,H);const P=col('--pos'),N=col('--neg'),Fc=col('--force'),I=col('--ink'),L=col('--line');\n cx.strokeStyle=L;cx.lineWidth=1;cx.globalAlpha=.5;\n for(let x=0;x<W;x+=40){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}\n for(let y=0;y<H;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}\n cx.globalAlpha=1;const s=ch[sel],o=nearest(s),f=forces();\n if(o){cx.setLineDash([5,5]);cx.strokeStyle=I;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(o.x,o.y);cx.stroke();cx.setLineDash([]);\n  cx.fillStyle=I;cx.font='13px system-ui,sans-serif';cx.textAlign='center';cx.fillText('r = '+fmt(Math.hypot(s.x-o.x,s.y-o.y)/10)+' cm',(s.x+o.x)/2,(s.y+o.y)/2-8)}\n ch.forEach(c=>{cx.fillStyle=c.q>0?P:N;cx.beginPath();cx.arc(c.x,c.y,rad(c),0,7);cx.fill();\n  if(c===s){cx.strokeStyle=I;cx.lineWidth=3;cx.beginPath();cx.arc(c.x,c.y,rad(c)+5,0,7);cx.stroke()}\n  cx.fillStyle='#fff';cx.font='bold 18px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(sg(c.q),c.x,c.y+1);cx.textBaseline='alphabetic'});\n ch.forEach((c,i)=>{const F=Math.hypot(f[i][0],f[i][1]);if(F<1e-3)return;const u=[f[i][0]/F,f[i][1]/F],L2=Math.min(100,30*Math.log10(1+F*10)),r=rad(c)+2;\n  arrow(c.x+u[0]*r,c.y+u[1]*r,u[0]*L2,u[1]*L2,Fc)})}\nfunction ui(){const s=ch[sel],o=nearest(s),f=forces()[sel],F=Math.hypot(f[0],f[1]);$('qv').textContent=fmt(Math.abs(s.q));\n if(o){const d=Math.hypot(s.x-o.x,s.y-o.y),Fp=K*Math.abs(s.q*o.q)*1e-12/(Math.max(d,DMIN)*MM)**2;\n  $('pair').textContent='Vybraný náboj ('+sg(s.q)+fmt(Math.abs(s.q))+' µC) a nejbližší ('+sg(o.q)+fmt(Math.abs(o.q))+' µC) jsou od sebe '+fmt(d/10)+' cm. '+(s.q*o.q>0?'Odpuzují se':'Přitahují se')+' silou '+fmt(Fp)+' N.'}\n else $('pair').textContent='Klepni do plochy a přidej druhý náboj.';\n $('net').textContent='Výsledná síla na vybraný náboj ze všech ostatních: '+fmt(F)+' N.';\n const fp=Math.max(...ch.filter(c=>c!==s).map(c=>K*Math.abs(s.q*c.q)*1e-12/(Math.max(Math.hypot(s.x-c.x,s.y-c.y),DMIN)*MM)**2)),rt=F/fp;\n $('task').innerHTML=ch.length<3?'Zatím máš jen '+ch.length+' náboje. Přidej další.':rt<.4?'<span class=\"ok\">Splněno! Síly se na vybraném náboji vyrušily.<\/span>':'Zatím ne, výslednice je '+fmt(F)+' N, což je '+fmt(rt*100)+' % největší dílčí síly. Cíl je pod 40 %. Tip: dva stejné náboje po stranách a vybraný uprostřed.';\n const q=ch.reduce((a,c)=>a+c.q,0),n=Math.abs(q)*1e-6/1.602e-19;\n $('sum').textContent=Math.abs(q)<1e-9?'Celkový náboj na ploše: 0 µC. Kladné a záporné se vyrušily, nic nezmizelo.':'Celkový náboj na ploše: '+fmt(q)+' µC, což je asi '+fmt(n/10**Math.floor(Math.log10(n)))+' × 10'+sup(Math.floor(Math.log10(n)))+' elektronů '+(q<0?'navíc':'chybějících')+'.'}\ncv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,i=ch.findIndex(c=>Math.hypot(c.x-x,c.y-y)<rad(c)+8);\n if(i>=0){sel=i;drag=ch[i];cv.setPointerCapture(e.pointerId);sync()}\n else if(ch.length<8){ch.push({x,y,q:sign*+$('size').value,vx:0,vy:0});sel=ch.length-1;sync()}});\ncv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=Math.min(W-14,Math.max(14,e.clientX-r.left));drag.y=Math.min(H-14,Math.max(14,e.clientY-r.top));drag.vx=drag.vy=0});\n['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=null));\n$('size').oninput=e=>{const c=ch[sel];c.q=(c.q>0?1:-1)*+e.target.value};\nfunction setSign(s){sign=s;$('bp').setAttribute('aria-pressed',s>0);$('bn').setAttribute('aria-pressed',s<0)}\n$('bp').onclick=()=>setSign(1);$('bn').onclick=()=>setSign(-1);\n$('fl').onclick=()=>{ch[sel].q*=-1};\n$('del').onclick=()=>{if(ch.length>1){ch.splice(sel,1);sel=0;sync()}};\n$('mv').onclick=e=>{moving=!moving;e.target.setAttribute('aria-pressed',moving);ch.forEach(c=>c.vx=c.vy=0)};\n$('rs').onclick=reset;\naddEventListener('resize',resize);resize();\nlet t0=performance.now();(function loop(t){const dt=Math.min(.03,(t-t0)/1000);t0=t;if(moving&&!drag)step(dt);else if(moving)step(dt);draw();ui();requestAnimationFrame(loop)})(t0);\n<\/script>\n<\/body>\n<\/html>\n","<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Mapa elektřiny – 2. Pole a síla<\/title>\n<style>\n:root{--bg:#e9eff6;--panel:#fff;--ink:#14213d;--mute:#53647c;--line:#c5d1e0;--pos:#d6304a;--neg:#1f6feb;--force:#b86e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nmain{max-width:760px;margin:0 auto;padding:14px 16px 32px}\nol{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:0 0 6px;margin:0}\nol li{white-space:nowrap;padding:3px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px}\nol li.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}\na{color: H-14,c.y)});dirty=true}\nfunction reset(){ch=[{x:.33*W,y:.55*H,q:3},{x:.67*W,y:.55*H,q:-3}];T.x=.5*W;T.y=.2*H;sel=0;trail=[];sync();dirty=true}\nfunction sync(){$('size').value=Math.abs(ch[sel].q)}\nfunction build(){lines=[];const dir=ch.some(c=>c.q>0)?1:-1;\n ch.filter(c=>c.q*dir>0).forEach(c=>{const n=Math.round(4+2*Math.abs(c.q)),r=rad(c);\n  for(let k=0;k<n;k++){const a=6.2832*(k+.5)/n;let x=c.x+Math.cos(a)*r,y=c.y+Math.sin(a)*r;const p=[[x,y]];\n   for(let i=0;i<500;i++){const e=E(x,y),m=Math.hypot(e[0],e[1]);if(m<1)break;x+=dir*e[0]/m*4;y+=dir*e[1]/m*4;p.push([x,y]);\n    if(x<-5||y<-5||x>W+5||y>H+5||ch.some(o=>o!==c&&o.q*dir<0&&Math.hypot(o.x-x,o.y-y)<rad(o)))break}\n   lines.push([p,dir])}});dirty=false}\nfunction arrow(x,y,dx,dy,color,w){const l=Math.hypot(dx,dy);if(l<3)return;const h=Math.min(10,l*.6);cx.strokeStyle=cx.fillStyle=color;cx.lineWidth=w;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+dx,y+dy);cx.stroke();\n const a=Math.atan2(dy,dx),X=x+dx,Y=y+dy;cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X-h*Math.cos(a-.4),Y-h*Math.sin(a-.4));cx.lineTo(X-h*Math.cos(a+.4),Y-h*Math.sin(a+.4));cx.fill()}\nfunction draw(){cx.clearRect(0,0,W,H);if(dirty)build();const P=col('--pos'),N=col('--neg'),Fc=col('--force'),I=col('--ink'),M=col('--mute');\n if(showL){cx.strokeStyle=M;cx.lineWidth=1.5;cx.globalAlpha=.8;lines.forEach(([p,dir])=>{cx.beginPath();p.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke();\n  cx.fillStyle=M;for(let i=14;i<p.length-1;i+=18){const a=Math.atan2(dir*(p[i+1][1]-p[i][1]),dir*(p[i+1][0]-p[i][0])),[x,y]=p[i];cx.beginPath();cx.moveTo(x+6*Math.cos(a),y+6*Math.sin(a));cx.lineTo(x+6*Math.cos(a+2.5),y+6*Math.sin(a+2.5));cx.lineTo(x+6*Math.cos(a-2.5),y+6*Math.sin(a-2.5));cx.fill()}});cx.globalAlpha=1}\n if(showV)for(let x=25;x<W;x+=50)for(let y=25;y<H;y+=50){if(ch.some(c=>Math.hypot(c.x-x,c.y-y)<rad(c)+12))continue;const e=E(x,y),m=Math.hypot(e[0],e[1]),l=Math.min(22,7*Math.log10(1+m/1e4));arrow(x-e[0]/m*l/2,y-e[1]/m*l/2,e[0]/m*l,e[1]/m* náboji.'}\nfunction step(dt){const e=E(T.x,T.y),m=Math.hypot(e[0],e[1]);if(m<1||ch.some(c=>Math.hypot(c.x-T.x,c.y-T.y)<rad(c)+8))return;\n const d=T.q>0?1:-1,v=Math.min(300,20+m/3e4);T.x=clamp(T.x+d*e[0]/m*v*dt,10,W-10);T.y=clamp(T.y+d*e[1]/m*v*dt,10,H-10);trail.push([T.x,T.y]);if(trail.length>400)trail.shift()}\ncv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;\n if(Math.hypot(T.x-x,T.y-y)<20){drag=T;trail=[];cv.setPointerCapture(e.pointerId);return}\n const i=ch.findIndex(c=>Math.hypot(c.x-x,c.y-y)<rad(c)+8);\n if(i>=0){sel=i;drag=ch[i];cv.setPointerCapture(e.pointerId);sync()}\n else if(ch.length<8){ch.push({x,y,q:sign*+$('size').value});sel=ch.length-1;sync();dirty=true}});\ncv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=clamp(e.clientX-r.left,14,W-14);drag.y=clamp(e.clientY-r.top,14,H-14);if(drag===T)trail=[];else dirty=true});\n['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=null));\n$('size').oninput=e=>{const c=ch[sel];c.q=(c.q>0?1:-1)*+e.target.value;dirty=true};\n$('tq').oninput=e=>{T.q=+e.target.value||1;trail=[]};\nfunction setSign(s){sign=s;$('bp').setAttribute('aria-pressed',s>0);$('bn').setAttribute('aria-pressed',s<0)}\n$('bp').onclick=()=>setSign(1);$('bn').onclick=()=>setSign(-1);\n$('fl').onclick=()=>{ch[sel].q*=-1;dirty=true};\n$('del').onclick=()=>{if(ch.length>1){ch.splice(sel,1);sel=0;sync();dirty=true}};\n$('sl').onclick=e=>{showL=!showL;e.target.setAttribute('aria-pressed',showL)};\n$('sv').onclick=e=>{showV=!showV;e.target.setAttribute('aria-pressed',showV)};\n$('mv').onclick=e=>{run=!run;trail=[];e.target.setAttribute('aria-pressed',run)};\n$('rs').onclick=reset;\naddEventListener('resize',resize);resize();\nlet t0=performance.now();(function loop(t){const dt=Math.min(.03,(t-t0)/1000);t0=t;if(run&&drag!==T)step(dt);draw();ui();requestAnimationFrame(loop)})(t0);\n<\/script>\n<\/body>\n<\/html>\n","<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Mapa elektřiny – 3. Potenciál<\/title>\n<style>\n:root{--bg:#e9eff6;--panel:#fff;--ink:#14213d;--mute:#53647c;--line:#c5d1e0;--pos:#d6304a;--neg:#1f6feb;--force:#b86e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nmain{max-width:760px;margin:0 auto;padding:14px 16px 32px}\nol{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:0 0 6px;margin:0}\nol li{white-space:nowrap;padding:3px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px}\nol li.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}\na{color:inherit;text-decoration:none}\nh1{font:600 30px/1.15 \"Iowan Old Style\",Palatino,Georgia,serif;margin:14px 0 6px}\nh2{font:600 19px/1.2 \"Iowan Old Style\",Palatino,Georgia,serif;margin:0 0 8px}\np{margin:0 0 8px}.mute{color:var(--mute);font-size:14px}\ncanvas{width:100%;display:block;border-radius:14px;background:var(--panel);border:1px solid var(--line)}\n#stage{height:min(56vh,410px);touch-action:none;cursor:crosshair;margin-top:10px}\n#prof{height:110px;margin-top:8px;border-radius:12px}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\nbutton{font:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\nbutton[aria-pressed=\"true\"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}\n:focus-visible{outline:3px solid var(--force);outline-offset:2px}\nlabel{display:block;font-size:15px}input[type=range]{width:100%;min-height:36px;accent-color:var(--force)}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}\n.f{font:600 22px/1.3 \"Iowan Old Style\",Palatino,Georgia,serif}\n.ok{color:var(--force);font-weight:600}\nul{margin:0;padding-left:20px}ul li{margin-bottom:6px}\n<\/style>\n<\/head>\n<body>\n<main>\n\n<h1>Potenciál jako krajina<\/h1>\n<p>Červená je kopec (kladný potenciál), modrá údolí (záporný). Tenké čáry jsou ekvipotenciály, tedy vrstevnice (tlustší je nulový potenciál). Táhni testovacím nábojem a sleduj pod plochou řez krajinou.<\/p>\n<canvas id=\"stage\" role=\"img\" aria-label=\"Barevná mapa potenciálu s vrstevnicemi a testovacím nábojem\"><\/canvas>\n<canvas id=\"prof\" role=\"img\" aria-label=\"Řez potenciálem ve výšce testovacího náboje\"><\/canvas>\n<p class=\"mute\" style=\"margin-top:6px\">Řez potenciálem podél vodorovné čáry, na které leží testovací náboj.<\/p>\n<div class=\"row\">\n<button id=\"bp\" aria-pressed=\"true\">+ kladný<\/button>\n<button id=\"bn\" aria-pressed=\"false\">− záporný<\/button>\n<button id=\"fl\">Obrátit vybraný<\/button>\n<button id=\"del\">Smazat vybraný<\/button>\n<button id=\"mv\" aria-pressed=\"false\">Nechat kutálet<\/button>\n<button id=\"rs\">Začít znovu<\/button>\n<\/div>\n<label>Vybraný zdrojový náboj: <b id=\"qv\">3<\/b> µC<input id=\"size\" type=\"range\" min=\"1\" max=\"10\" step=\"0.5\" value=\"3\"><\/label>\n<label>Testovací náboj q: <b id=\"tv\">2<\/b> nC<input id=\"tq\" type=\"range\" min=\"-10\" max=\"10\" step=\"1\" value=\"2\"><\/label>\n\n<section class=\"card\">\n<h2>Potenciál a energie<\/h2>\n<p class=\"f\">V = k · Q / r &nbsp;·&nbsp; U = q · V<\/p>\n<p id=\"read\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Úkol: najdi nulový potenciál<\/h2>\n<p>Při jednom kladném a jednom záporném náboji přetáhni testovací náboj tam, kde je potenciál nulový. Stačí přibližně.<\/p>\n<p id=\"task\" class=\"mute\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Co si odnést<\/h2>\n<ul>\n<li>Potenciál je jedno číslo v každém bodě. Potenciály zdrojů se prostě sčítají, žádné šipky skládat nemusíš.<\/li>\n<li>Pole míří kolmo na vrstevnice a „z kopce dolů“, od vyššího potenciálu k nižšímu.<\/li>\n<li>Kladný náboj se kutálí k nižšímu potenciálu, záporný k vyššímu. Jeho energie je U = q · V.<\/li>\n<\/ul>\n<\/section>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id),cv=$('stage'),cx=cv.getContext('2d'),pv=$('prof'),px=pv.getContext('2d'),hm=document.createElement('canvas'),hx=hm.getContext('2d');\nconst K=8.99e9,MM=1e-3,S=5; // 1 px = 1 mm\nlet nx=0,ny=0,gv=[],pathA=null,pathZ=null;\nlet W=0,H=0,sign=1,sel=0,run=false,drag=null,ch=[],T={x:0,y:0,q:2},trail=[],dirty=true;\nconst col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst fmt=n=>n.toLocaleString('cs-CZ',{maximumFractionDigits:Math.abs(n)<10?2:Math.abs(n)<100?1:0});\nconst rad=c=>11+Math.abs(c.q)*1.3,sg=q=>q>0?'+':'−',clamp=(v,a,b)=>Math.min(b,Math.max(a,v));\nfunction VE(x,y){let v=0,ex=0,ey=0;for(const c of ch){const dx=(x-c.x)*MM,dy=(y-c.y)*MM,d=Math.max(Math.hypot(dx,dy),.006),k=K*c.q*1e-6;v+=k/d;ex+=k*dx/d**3;ey+=k*dy/d**3}return[v,ex,ey]}\nfunction resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);pv.width=W*d;pv.height=110*d;px.setTransform(d,0,0,d,0,0);\n if(!ch.length)reset();[...ch,T].forEach(c=>{c.x=Math.min(W-14,c.x);c.y=Math.min(H-14,c.y)});dirty=true}\nfunction reset(){ch=[{x:.33*W,y:.55*H,q:3},{x:.67*W,y:.55*H,q:-3}];T.x=.5*W;T.y=.2*H;sel=0;trail=[];sync();dirty=true}\nfunction sync(){$('size').value=Math.abs(ch[sel].q)}\nfunction build(){const w=nx=hm.width=Math.ceil(W/S)+1,h=ny=hm.height=Math.ceil(H/S)+1,im=hx.createImageData(w,h),a=im.data;gv=new Float32Array(w*h);\n for(let j=0;j<h;j++)for(let i=0;i<w;i++){const v=VE(i*S,j*S)[0],s=Math.tanh(v/2.5e5),k=(j*w+i)*4;gv[j*w+i]=v;\n  \n  {a[k]=s>0?230:50;a[k+1]=s>0?60:120;a[k+2]=s>0?80:240;a[k+3]=Math.abs(s)*150}}\n hx.putImageData(im,0,0);contours();dirty=false}\nfunction contours(){pathA=new Path2D();pathZ=new Path2D();const lv=[0];for(let k=0;k<12;k++){const v=5e4*Math.SQRT2**k;lv.push(v,-v)}\n lv.forEach(L=>{const P=L?pathA:pathZ;\n  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){const a=gv[j*nx+i]-L,b=gv[j*nx+i+1]-L,c=gv[(j+1)*nx+i+1]-L,d=gv[(j+1)*nx+i]-L,x=i*S,y=j*S,p=[];\n   if(a*b<0)p.push([x+S*a/(a-b),y]);if(b*c<0)p.push([x+S,y+S*b/(b-c)]);if(d*c<0)p.push([x+S*d/(d-c),y+S]);if(a*d<0)p.push([x,y+S*a/(a-d)]);\n   for(let k=0;k+1<p.length;k+=2){P.moveTo(p[k][0],p[k][1]);P.lineTo(p[k+1][0],p[k+1][1])}}})}\nfunction arrow(x,y,dx,dy,color,w){const l=Math.hypot(dx,dy);if(l<3)return;const h=Math.min(10,l*.6);cx.strokeStyle=cx.fillStyle=color;cx.lineWidth=w;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+dx,y+dy);cx.stroke();\n const a=Math.atan2(dy,dx),X=x+dx,Y=y+dy;cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X-h*Math.cos(a-.4),Y-h*Math.sin(a-.4));cx.lineTo(X-h*Math.cos(a+.4),Y-h*Math.sin(a+.4));cx.fill()}\nfunction draw(){if(dirty)build();cx.clearRect(0,0,W,H);cx.imageSmoothingEnabled=true;cx.drawImage(hm,-S/2,-S/2,nx*S,ny*S);cx.lineJoin='round';cx.strokeStyle=col('--ink');cx.globalAlpha=.4;cx.lineWidth=1.2;cx.stroke(pathA);cx.globalAlpha=.9;cx.lineWidth=2;cx.stroke(pathZ);cx.globalAlpha=1;\n const P=col('--pos'),N=col('--neg'),Fc=col('--force'),I=col('--ink');\n if(trail.length>1){cx.strokeStyle=Fc;cx.lineWidth=2.5;cx.beginPath();trail.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke()}\n ch.forEach((c,i)=>{cx.fillStyle=c.q>0?P:N;cx.beginPath();cx.arc(c.x,c.y,rad(c),0,7);cx.fill();\n  if(i===sel){cx.strokeStyle=I;cx.lineWidth=3;cx.beginPath();cx.arc(c.x,c.y,rad(c)+5,0,7);cx.stroke()}\n  cx.fillStyle='#fff';cx.font='bold 18px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(sg(c.q),c.x,c.y+1)});\n const[v,ex,ey]=VE(T.x,T.y),m=Math.hypot(ex,ey);\n if(m>1){const d=T.q>0?1:-1,F=Math.abs(T.q)*1e-9*m,lf=Math.min(90,30*Math.log10(1+F*4e3));arrow(T.x+d*ex/m*13,T.y+d*ey/m*13,d*ex/m*lf,d*ey/m*lf,Fc,4)}\n cx.fillStyle=col('--panel');cx.strokeStyle=T.q>0?P:N;cx.lineWidth=3;cx.beginPath();cx.arc(T.x,T.y,10,0,7);cx.fill();cx.stroke();\n cx.fillStyle=I;cx.font='bold 13px system-ui,sans-serif';cx.fillText('q',T.x,T.y+1);\n px.clearRect(0,0,W,110);px.strokeStyle=col('--line');px.lineWidth=1;px.beginPath();px.moveTo(0,55);px.lineTo(W,55);px.stroke();\n px.strokeStyle=I;px.lineWidth=2;px.beginPath();for(let x=0;x<=W;x+=3){const y=55-Math.tanh(VE(x,T.y)[0]/3e5)*48;x?px.lineTo(x,y):px.moveTo(x,y)}px.stroke();\n px.fillStyle=Fc;px.beginPath();px.arc(T.x,55-Math.tanh(v/3e5)*48,6,0,7);px.fill()}\nfunction ui(){const v=VE(T.x,T.y)[0],U=T.q*v*1e-6;$('qv').textContent=fmt(Math.abs(ch[sel].q));$('tv').textContent=fmt(T.q);\n $('read').textContent='V místě testovacího náboje je potenciál V = '+fmt(v/1e3)+' kV. Náboj q = '+sg(T.q)+fmt(Math.abs(T.q))+' nC tam má potenciální energii U = q · V = '+fmt(U)+' mJ. Pustíš-li ho, bude se kutálet k nižší energii.';\n const mx=Math.max(...ch.map(c=>K*Math.abs(c.q)*1e-6/Math.max(Math.hypot(c.x-T.x,c.y-T.y)*MM,.006))),rt=Math.abs(v)/mx,both=ch.some(c=>c.q>0)&&ch.some(c=>c.q<0);\n $('task').innerHTML=!both?'Potřebuješ aspoň jeden kladný a jeden záporný náboj.':rt<.3?'<span class=\"ok\">Splněno! Potenciál je tu téměř nulový, jsi na rozhraní kopce a údolí.<\/span>':'Zatím ne, potenciál tu je '+fmt(rt*100)+' % největšího dílčího. Cíl je pod 30 %.'}\nfunction step(dt){const[,ex,ey]=VE(T.x,T.y),m=Math.hypot(ex,ey);if(m<1||ch.some(c=>Math.hypot(c.x-T.x,c.y-T.y)<rad(c)+8))return;\n const d=T.q>0?1:-1,v=Math.min(300,20+m/3e4);T.x=clamp(T.x+d*ex/m*v*dt,10,W-10);T.y=clamp(T.y+d*ey/m*v*dt,10,H-10);trail.push([T.x,T.y]);if(trail.length>400)trail.shift()}\ncv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;\n if(Math.hypot(T.x-x,T.y-y)<20){drag=T;trail=[];cv.setPointerCapture(e.pointerId);return}\n const i=ch.findIndex(c=>Math.hypot(c.x-x,c.y-y)<rad(c)+8);\n if(i>=0){sel=i;drag=ch[i];cv.setPointerCapture(e.pointerId);sync()}\n else if(ch.length<8){ch.push({x,y,q:sign*+$('size').value});sel=ch.length-1;sync();dirty=true}});\ncv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=clamp(e.clientX-r.left,14,W-14);drag.y=clamp(e.clientY-r.top,14,H-14);if(drag===T)trail=[];else dirty=true});\n['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=null));\n$('size').oninput=e=>{const c=ch[sel];c.q=(c.q>0?1:-1)*+e.target.value;dirty=true};\n$('tq').oninput=e=>{T.q=+e.target.value||1;trail=[]};\nfunction setSign(s){sign=s;$('bp').setAttribute('aria-pressed',s>0);$('bn').setAttribute('aria-pressed',s<0)}\n$('bp').onclick=()=>setSign(1);$('bn').onclick=()=>setSign(-1);\n$('fl').onclick=()=>{ch[sel].q*=-1;dirty=true};\n$('del').onclick=()=>{if(ch.length>1){ch.splice(sel,1);sel=0;sync();dirty=true}};\n$('mv').onclick=e=>{run=!run;trail=[];e.target.setAttribute('aria-pressed',run)};\n$('rs').onclick=reset;\naddEventListener('resize',resize);resize();\nlet t0=performance.now();(function loop(t){const dt=Math.min(.03,(t-t0)/1000);t0=t;if(run&&drag!==T)step(dt);draw();ui();requestAnimationFrame(loop)})(t0);\n<\/script>\n<\/body>\n<\/html>\n","<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Mapa elektřiny – 4. Napětí<\/title>\n<style>\n:root{--bg:#e9eff6;--panel:#fff;--ink:#14213d;--mute:#53647c;--line:#c5d1e0;--pos:#d6304a;--neg:#1f6feb;--force:#b86e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nmain{max-width:760px;margin:0 auto;padding:14px 16px 32px}\nol{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:0 0 6px;margin:0}\nol li{white-space:nowrap;padding:3px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px}\nol li.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}\na{color:inherit;text-decoration:none}\nh1{font:600 30px/1.15 \"Iowan Old Style\",Palatino,Georgia,serif;margin:14px 0 6px}\nh2{font:600 19px/1.2 \"Iowan Old Style\",Palatino,Georgia,serif;margin:0 0 8px}\np{margin:0 0 8px}.mute{color:var(--mute);font-size:14px}\ncanvas{width:100%;display:block;border-radius:14px;background:var(--panel);border:1px solid var(--line)}\n#stage{height:min(56vh,410px);touch-action:none;cursor:crosshair;margin-top:10px}\n#prof{height:110px;margin-top:8px;border-radius:12px}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\nbutton{font:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\nbutton[aria-pressed=\"true\"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}\n:focus-visible{outline:3px solid var(--force);outline-offset:2px}\nlabel{display:block;font-size:15px}input[type=range]{width:100%;min-height:36px;accent-color:var(--force)}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}\n.f{font:600 22px/1.3 \"Iowan Old Style\",Palatino,Georgia,serif}\n.ok{color:var(--force);font-weight:600}\nul{margin:0;padding-left:20px}ul li{margin-bottom:6px}\n<\/style>\n<\/head>\n<body>\n<main>\n\n<h1>Napětí je rozdíl výšek<\/h1>\n<p>Táhni body A a B po krajině z minulé zastávky. Napětí U mezi nimi je rozdíl jejich potenciálů, tedy převýšení. Pod plochou vidíš řez přesně podél úsečky AB.<\/p>\n<canvas id=\"stage\" role=\"img\" aria-label=\"Barevná mapa potenciálu s vrstevnicemi a testovacím nábojem\"><\/canvas>\n<canvas id=\"prof\" role=\"img\" aria-label=\"Řez potenciálem ve výšce testovacího náboje\"><\/canvas>\n<p class=\"mute\" style=\"margin-top:6px\">Řez potenciálem podél úsečky z A do B. Svislý rozdíl koncových bodů je napětí U.<\/p>\n<div class=\"row\">\n<button id=\"bp\" aria-pressed=\"true\">+ kladný<\/button>\n<button id=\"bn\" aria-pressed=\"false\">− záporný<\/button>\n<button id=\"fl\">Obrátit vybraný<\/button>\n<button id=\"del\">Smazat vybraný<\/button>\n\n<button id=\"rs\">Začít znovu<\/button>\n<\/div>\n<label>Vybraný zdrojový náboj: <b id=\"qv\">3<\/b> µC<input id=\"size\" type=\"range\" min=\"1\" max=\"10\" step=\"0.5\" value=\"3\"><\/label>\n<label>Přenášený náboj q: <b id=\"tv\">2<\/b> nC<input id=\"tq\" type=\"range\" min=\"-10\" max=\"10\" step=\"1\" value=\"2\"><\/label>\n\n<section class=\"card\">\n<h2>Napětí a práce<\/h2>\n<p class=\"f\">U = V<sub>A<\/sub> − V<sub>B<\/sub> &nbsp;·&nbsp; W = q · U<\/p>\n<p id=\"read\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Úkol: nastav napětí 100 kV<\/h2>\n<p>Přesuň body A a B tak, aby mezi nimi bylo napětí 100 kV. Stačí s odchylkou 25 kV.<\/p>\n<p id=\"task\" class=\"mute\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Co si odnést<\/h2>\n<ul>\n<li>Napětí je rozdíl potenciálů dvou bodů, U = V<sub>A<\/sub> − V<sub>B<\/sub>. Nezáleží na tom, po jaké cestě se z A do B dostaneš.<\/li>\n<li>Práce pole při přesunu náboje je W = q · U. Jeden volt je jeden joule na coulomb.<\/li>\n<li>Větší napětí na kratší vzdálenosti znamená silnější pole, zhruba E = U / d. Využívá to kondenzátor i baterie.<\/li>\n<\/ul>\n<\/section>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id),cv=$('stage'),cx=cv.getContext('2d'),pv=$('prof'),px=pv.getContext('2d'),hm=document.createElement('canvas'),hx=hm.getContext('2d');\nconst K=8.99e9,MM=1e-3,S=5; // 1 px = 1 mm\nlet nx=0,ny=0,gv=[],pathA=null,pathZ=null;\nlet W=0,H=0,sign=1,sel=0,run=false,drag=null,ch=[],T={x:0,y:0,q:2},A={x:0,y:0},B={x:0,y:0},trail=[],dirty=true;\nconst col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst fmt=n=>n.toLocaleString('cs-CZ',{maximumFractionDigits:Math.abs(n)<10?2:Math.abs(n)<100?1:0});\nconst rad=c=>11+Math.abs(c.q)*1.3,sg=q=>q>0?'+':'−',clamp=(v,a,b)=>Math.min(b,Math.max(a,v));\nfunction VE(x,y){let v=0,ex=0,ey=0;for(const c of ch){const dx=(x-c.x)*MM,dy=(y-c.y)*MM,d=Math.max(Math.hypot(dx,dy),.006),k=K*c.q*1e-6;v+=k/d;ex+=k*dx/d**3;ey+=k*dy/d**3}return[v,ex,ey]}\nfunction resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);pv.width=W*d;pv.height=110*d;px.setTransform(d,0,0,d,0,0);\n if(!ch.length)reset();[...ch,A,B].forEach(c=>{c.x=Math.min(W-14,c.x);c.y=Math.min(H-14,c.y)});dirty=true}\nfunction reset(){ch=[{x:.33*W,y:.55*H,q:3},{x:.67*W,y:.55*H,q:-3}];A.x=.22*W;A.y=.2*H;B.x=.78*W;B.y=.82*H;sel=0;trail=[];sync();dirty=true}\nfunction sync(){$('size').value=Math.abs(ch[sel].q)}\nfunction build(){const w=nx=hm.width=Math.ceil(W/S)+1,h=ny=hm.height=Math.ceil(H/S)+1,im=hx.createImageData(w,h),a=im.data;gv=new Float32Array(w*h);\n for(let j=0;j<h;j++)for(let i=0;i<w;i++){const v=VE(i*S,j*S)[0],s=Math.tanh(v/2.5e5),k=(j*w+i)*4;gv[j*w+i]=v;\n  \n  {a[k]=s>0?230:50;a[k+1]=s>0?60:120;a[k+2]=s>0?80:240;a[k+3]=Math.abs(s)*150}}\n hx.putImageData(im,0,0);contours();dirty=false}\nfunction contours(){pathA=new Path2D();pathZ=new Path2D();const lv=[0];for(let k=0;k<12;k++){const v=5e4*Math.SQRT2**k;lv.push(v,-v)}\n lv.forEach(L=>{const P=L?pathA:pathZ;\n  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){const a=gv[j*nx+i]-L,b=gv[j*nx+i+1]-L,c=gv[(j+1)*nx+i+1]-L,d=gv[(j+1)*nx+i]-L,x=i*S,y=j*S,p=[];\n   if(a*b<0)p.push([x+S*a/(a-b),y]);if(b*c<0)p.push([x+S,y+S*b/(b-c)]);if(d*c<0)p.push([x+S*d/(d-c),y+S]);if(a*d<0)p.push([x,y+S*a/(a-d)]);\n   for(let k=0;k+1<p.length;k+=2){P.moveTo(p[k][0],p[k][1]);P.lineTo(p[k+1][0],p[k+1][1])}}})}\nfunction arrow(x,y,dx,dy,color,w){const l=Math.hypot(dx,dy);if(l<3)return;const h=Math.min(10,l*.6);cx.strokeStyle=cx.fillStyle=color;cx.lineWidth=w;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+dx,y+dy);cx.stroke();\n const a=Math.atan2(dy,dx),X=x+dx,Y=y+dy;cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X-h*Math.cos(a-.4),Y-h*Math.sin(a-.4));cx.lineTo(X-h*Math.cos(a+.4),Y-h*Math.sin(a+.4));cx.fill()}\nfunction draw(){if(dirty)build();cx.clearRect(0,0,W,H);cx.imageSmoothingEnabled=true;cx.drawImage(hm,-S/2,-S/2,nx*S,ny*S);cx.lineJoin='round';cx.strokeStyle=col('--ink');cx.globalAlpha=.4;cx.lineWidth=1.2;cx.stroke(pathA);cx.globalAlpha=.9;cx.lineWidth=2;cx.stroke(pathZ);cx.globalAlpha=1;\n const P=col('--pos'),N=col('--neg'),Fc=col('--force'),I=col('--ink');\n if(trail.length>1){cx.strokeStyle=Fc;cx.lineWidth=2.5;cx.beginPath();trail.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke()}\n ch.forEach((c,i)=>{cx.fillStyle=c.q>0?P:N;cx.beginPath();cx.arc(c.x,c.y,rad(c),0,7);cx.fill();\n  if(i===sel){cx.strokeStyle=I;cx.lineWidth=3;cx.beginPath();cx.arc(c.x,c.y,rad(c)+5,0,7);cx.stroke()}\n  cx.fillStyle='#fff';cx.font='bold 18px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(sg(c.q),c.x,c.y+1)});\n const pts=[[A,'A'],[B,'B']];cx.setLineDash([6,5]);cx.strokeStyle=I;cx.lineWidth=2;cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(B.x,B.y);cx.stroke();cx.setLineDash([]);\n \n pts.forEach(([o,n])=>{cx.fillStyle=col('--panel');cx.strokeStyle=I;cx.lineWidth=3;cx.beginPath();cx.arc(o.x,o.y,12,0,7);cx.fill();cx.stroke();cx.fillStyle=I;cx.font='bold 14px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(n,o.x,o.y+1)});\n \n px.clearRect(0,0,W,110);px.strokeStyle=col('--line');px.lineWidth=1;px.beginPath();px.moveTo(0,55);px.lineTo(W,55);px.stroke();\n px.strokeStyle=I;px.lineWidth=2;px.beginPath();for(let k=0;k<=80;k++){const t=k/80,y=55-Math.tanh(VE(A.x+(B.x-A.x)*t,A.y+(B.y-A.y)*t)[0]/3e5)*48,x=(.06+.88*t)*W;k?px.lineTo(x,y):px.moveTo(x,y)}px.stroke();\n [[A,.06],[B,.94]].forEach(([o,f])=>{const y=55-Math.tanh(VE(o.x,o.y)[0]/3e5)*48;px.fillStyle=Fc;px.beginPath();px.arc(f*W,y,6,0,7);px.fill();px.fillStyle=I;px.font='bold 12px system-ui,sans-serif';px.textAlign='center';px.fillText(o===A?'A':'B',f*W,y-11)})}\nfunction ui(){const va=VE(A.x,A.y)[0],vb=VE(B.x,B.y)[0],U=va-vb,Wk=T.q*U*1e-6,dd=Math.hypot(A.x-B.x,A.y-B.y)*MM;$('qv').textContent=fmt(Math.abs(ch[sel].q));$('tv').textContent=fmt(T.q);\n $('read').textContent='V_A = '+fmt(va/1e3)+' kV, V_B = '+fmt(vb/1e3)+' kV, takže napětí U = V_A − V_B = '+fmt(U/1e3)+' kV. Při přesunu náboje q = '+sg(T.q)+fmt(Math.abs(T.q))+' nC z A do B vykoná pole práci W = q · U = '+fmt(Wk)+' mJ'+(Wk<0?' (záporná, musel bys ho tlačit sám).':'.')+' Body jsou od sebe '+fmt(dd*100)+' cm, průměrná intenzita U / d je zhruba '+fmt(Math.abs(U)/dd/1e6)+' MN/C.';\n const dev=Math.abs(U-1e5);\n $('task').innerHTML=dev<2.5e4?'<span class=\"ok\">Splněno! Napětí mezi A a B je '+fmt(U/1e3)+' kV.<\/span>':'Zatím ne, napětí je '+fmt(U/1e3)+' kV. Cíl je 100 kV, stačí ±25 kV.'}\nfunction step(dt){const[,ex,ey]=VE(T.x,T.y),m=Math.hypot(ex,ey);if(m<1||ch.some(c=>Math.hypot(c.x-T.x,c.y-T.y)<rad(c)+8))return;\n const d=T.q>0?1:-1,v=Math.min(300,20+m/3e4);T.x=clamp(T.x+d*ex/m*v*dt,10,W-10);T.y=clamp(T.y+d*ey/m*v*dt,10,H-10);trail.push([T.x,T.y]);if(trail.length>400)trail.shift()}\ncv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;\n const ab=[A,B].find(o=>Math.hypot(o.x-x,o.y-y)<22);if(ab){drag=ab;cv.setPointerCapture(e.pointerId);return}\n const i=ch.findIndex(c=>Math.hypot(c.x-x,c.y-y)<rad(c)+8);\n if(i>=0){sel=i;drag=ch[i];cv.setPointerCapture(e.pointerId);sync()}\n else if(ch.length<8){ch.push({x,y,q:sign*+$('size').value});sel=ch.length-1;sync();dirty=true}});\ncv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=clamp(e.clientX-r.left,14,W-14);drag.y=clamp(e.clientY-r.top,14,H-14);if(drag!==A&&drag!==B)dirty=true});\n['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=null));\n$('size').oninput=e=>{const c=ch[sel];c.q=(c.q>0?1:-1)*+e.target.value;dirty=true};\n$('tq').oninput=e=>{T.q=+e.target.value||1;trail=[]};\nfunction setSign(s){sign=s;$('bp').setAttribute('aria-pressed',s>0);$('bn').setAttribute('aria-pressed',s<0)}\n$('bp').onclick=()=>setSign(1);$('bn').onclick=()=>setSign(-1);\n$('fl').onclick=()=>{ch[sel].q*=-1;dirty=true};\n$('del').onclick=()=>{if(ch.length>1){ch.splice(sel,1);sel=0;sync();dirty=true}};\n\n$('rs').onclick=reset;\naddEventListener('resize',resize);resize();\nlet t0=performance.now();(function loop(t){const dt=Math.min(.03,(t-t0)/1000);t0=t;if(run&&drag!==T)step(dt);draw();ui();requestAnimationFrame(loop)})(t0);\n<\/script>\n<\/body>\n<\/html>\n","<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Mapa elektřiny – 5. Proud<\/title>\n<style>\n:root{--bg:#e9eff6;--panel:#fff;--ink:#14213d;--mute:#53647c;--line:#c5d1e0;--pos:#d6304a;--neg:#1f6feb;--force:#b86e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nmain{max-width:760px;margin:0 auto;padding:14px 16px 32px}\nol{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:0 0 6px;margin:0}\nol li{white-space:nowrap;padding:3px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px}\nol li.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}\na{color:inherit;text-decoration:none}\nh1{font:600 30px/1.15 \"Iowan Old Style\",Palatino,Georgia,serif;margin:14px 0 6px}\nh2{font:600 19px/1.2 \"Iowan Old Style\",Palatino,Georgia,serif;margin:0 0 8px}\np{margin:0 0 8px}.mute{color:var(--mute);font-size:14px}\ncanvas{width:100%;display:block;border-radius:14px;background:var(--panel);border:1px solid var(--line)}\n#stage{height:min(56vh,410px);touch-action:none;cursor:crosshair;margin-top:10px}\n#prof{height:110px;margin-top:8px;border-radius:12px}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\nbutton{font:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\nbutton[aria-pressed=\"true\"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}\n:focus-visible{outline:3px solid var(--force);outline-offset:2px}\nlabel{display:block;font-size:15px}input[type=range]{width:100%;min-height:36px;accent-color:var(--force)}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}\n.f{font:600 22px/1.3 \"Iowan Old Style\",Palatino,Georgia,serif}\n.ok{color:var(--force);font-weight:600}\nul{margin:0;padding-left:20px}ul li{margin-bottom:6px}\n<\/style>\n<\/head>\n<body>\n<main>\n\n<h1>Elektrický proud<\/h1>\n<p>Proud je náboj, který projde průřezem drátu za sekundu. Přestavuj proud a tloušťku drátu a sleduj, jak pomalu se elektrony doopravdy pohybují.<\/p>\n<canvas id=\"stage\" style=\"height:260px;touch-action:auto;cursor:default\" role=\"img\" aria-label=\"Drát s pohybujícími se elektrony a průřezem, kterým se počítá náboj\"><\/canvas>\n<p class=\"mute\" style=\"margin-top:6px\">Jedna modrá tečka představuje 0,1 C. Pohyb je pro přehlednost mnohonásobně zrychlený (skutečná rychlost je dole v textu), chvění teplem je jen na ozdobu.<\/p>\n<div class=\"row\"><button id=\"rs\">Vynulovat měření<\/button><\/div>\n<label>Proud I: <b id=\"iv\">1<\/b> A<input id=\"cur\" type=\"range\" min=\"0.2\" max=\"3\" step=\"0.1\" value=\"1\"><\/label>\n<label>Průřez drátu S: <b id=\"sv\">1<\/b> mm²<input id=\"sec\" type=\"range\" min=\"0.5\" max=\"4\" step=\"0.1\" value=\"1\"><\/label>\n\n<section class=\"card\">\n<h2>Proud a rychlost elektronů<\/h2>\n<p class=\"f\">I = Q / t &nbsp;·&nbsp; v = I / (n · e · S)<\/p>\n<p id=\"read\"><\/p>\n<p class=\"mute\">n je počet volných elektronů v jednom krychlovém metru mědi (asi 8,5 × 10²⁸), e je náboj elektronu.<\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Úkol: zpomal elektrony<\/h2>\n<p>Nastav proud a průřez tak, aby se elektrony posouvaly rychlostí asi 0,1 mm/s. Stačí s odchylkou 0,03 mm/s.<\/p>\n<p id=\"task\" class=\"mute\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Co si odnést<\/h2>\n<ul>\n<li>Proud je náboj, který projde průřezem za sekundu: I = Q / t. Jeden ampér je jeden coulomb za sekundu.<\/li>\n<li>Elektrony jsou záporné, a tak se pohybují proti dohodnutému směru proudu, od mínusu k plusu.<\/li>\n<li>V drátu se plouží zlomky milimetru za sekundu. Lampa svítí hned proto, že rychle se šíří pole, ne elektrony.<\/li>\n<\/ul>\n<\/section>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id),cv=$('stage'),cx=cv.getContext('2d');\nconst RHO=.002,QD=.1; // tečky na px², náboj jedné tečky v C\nlet W=0,H=0,el=[],Qc=0,tc=0,t0=performance.now();\nconst col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst fmt=(n,d=2)=>n.toLocaleString('cs-CZ',{maximumFractionDigits:d});\nconst gI=()=>+$('cur').value,gS=()=>+$('sec').value,hh=()=>20+30*gS();\nfunction seed(){const h=hh(),n=Math.round(RHO*W*h);el=[];for(let i=0;i<n;i++)el.push({x:Math.random()*W,y:(Math.random()-.5)*(h-10)});Qc=0;tc=0}\nfunction resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);seed()}\nfunction step(dt){const h=hh(),sp=Math.min(600,gI()/(QD*RHO*h)),m=W/2,lim=(h-10)/2;\n el.forEach(e=>{const o=e.x;e.x-=sp*dt+(Math.random()-.5)*160*dt;e.y=Math.max(-lim,Math.min(lim,e.y+(Math.random()-.5)*160*dt));\n  if(e.x<0)e.x+=W;if(e.x>W)e.x-=W;\n  if(o>m&&e.x<=m&&o-e.x<W/2)Qc+=QD;if(o<=m&&e.x>m&&e.x-o<W/2)Qc-=QD});tc+=dt}\nfunction arr(x,y,dx,c){cx.strokeStyle=cx.fillStyle=c;cx.lineWidth=3;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+dx,y);cx.stroke();const s=dx>0?1:-1;cx.beginPath();cx.moveTo(x+dx,y);cx.lineTo(x+dx-9*s,y-5);cx.lineTo(x+dx-9*s,y+5);cx.fill()}\nfunction draw(){cx.clearRect(0,0,W,H);const h=hh(),cy=H/2-18,F=col('--force'),K=col('--ink'),N=col('--neg'),P=col('--pos');\n cx.fillStyle='rgba(184,110,0,.16)';cx.fillRect(0,cy-h/2,W,h);cx.strokeStyle=F;cx.lineWidth=2;cx.strokeRect(0,cy-h/2,W,h);\n cx.fillStyle=N;el.forEach(e=>{cx.beginPath();cx.arc(e.x,cy+e.y,3.5,0,7);cx.fill()});\n cx.setLineDash([5,5]);cx.strokeStyle=K;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(W/2,cy-h/2-10);cx.lineTo(W/2,cy+h/2+10);cx.stroke();cx.setLineDash([]);\n cx.fillStyle=K;cx.font='13px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='alphabetic';cx.fillText('průřez',W/2,cy-h/2-14);\n cx.font='bold 20px system-ui,sans-serif';cx.fillStyle=P;cx.fillText('+',16,cy-h/2-10);cx.fillStyle=N;cx.fillText('−',W-16,cy-h/2-10);\n arr(70,H-36,-50,N);arr(20,H-14,50,F);cx.fillStyle=K;cx.font='13px system-ui,sans-serif';cx.textAlign='left';cx.textBaseline='middle';cx.fillText('elektrony (od − k +)',80,H-36);cx.fillText('proud (dohodnutý směr)',80,H-14)}\nfunction ui(){const v=.0734*gI()/gS(),hrs=10/(v*1e-3)/3600,Im=tc>.5?Qc/tc:null;\n $('iv').textContent=fmt(gI(),1);$('sv').textContent=fmt(gS(),1);\n $('read').textContent='Za t = '+fmt(tc,1)+' s prošlo průřezem Q = '+fmt(Qc,1)+' C'+(Im===null?'.':', takže I = Q / t = '+fmt(Im,2)+' A.')+' Skutečná driftová rychlost elektronů je v = '+fmt(v,3)+' mm/s. Deset metrů kabelu by elektron šel asi '+fmt(hrs,0)+' hodin, a lampa přesto svítí hned: pole se šíří téměř rychlostí světla.';\n $('task').innerHTML=Math.abs(v-.1)<.03?'<span class=\"ok\">Splněno! Driftová rychlost je '+fmt(v,3)+' mm/s.<\/span>':'Zatím ne, rychlost je '+fmt(v,3)+' mm/s. Cíl je 0,1 mm/s, stačí ±0,03.'}\n$('cur').oninput=()=>{Qc=0;tc=0};$('sec').oninput=seed;$('rs').onclick=()=>{Qc=0;tc=0};\naddEventListener('resize',resize);resize();\n(function loop(t){const dt=Math.min(.03,(t-t0)/1000);t0=t;step(dt);draw();ui();requestAnimationFrame(loop)})(t0);\n<\/script>\n<\/body>\n<\/html>\n","<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Mapa elektřiny – 6. Odpor<\/title>\n<style>\n:root{--bg:#e9eff6;--panel:#fff;--ink:#14213d;--mute:#53647c;--line:#c5d1e0;--pos:#d6304a;--neg:#1f6feb;--force:#b86e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nmain{max-width:760px;margin:0 auto;padding:14px 16px 32px}\nol{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:0 0 6px;margin:0}\nol li{white-space:nowrap;padding:3px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px}\nol li.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}\na{color:inherit;text-decoration:none}\nh1{font:600 30px/1.15 \"Iowan Old Style\",Palatino,Georgia,serif;margin:14px 0 6px}\nh2{font:600 19px/1.2 \"Iowan Old Style\",Palatino,Georgia,serif;margin:0 0 8px}\np{margin:0 0 8px}.mute{color:var(--mute);font-size:14px}\ncanvas{width:100%;display:block;border-radius:14px;background:var(--panel);border:1px solid var(--line)}\n#stage{height:min(56vh,410px);touch-action:none;cursor:crosshair;margin-top:10px}\n#prof{height:110px;margin-top:8px;border-radius:12px}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\nbutton{font:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\nbutton[aria-pressed=\"true\"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}\n:focus-visible{outline:3px solid var(--force);outline-offset:2px}\nlabel{display:block;font-size:15px}input[type=range]{width:100%;min-height:36px;accent-color:var(--force)}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}\n.f{font:600 22px/1.3 \"Iowan Old Style\",Palatino,Georgia,serif}\n.ok{color:var(--force);font-weight:600}\nul{margin:0;padding-left:20px}ul li{margin-bottom:6px}\n<\/style>\n<\/head>\n<body>\n<main>\n\n<h1>Odpor a Ohmův zákon<\/h1>\n<p>Vyber materiál a zkoušej délku, tloušťku i napětí. Pod drátem je graf Ohmova zákona: sklon přímky je odpor.<\/p>\n<canvas id=\"stage\" style=\"height:190px;touch-action:auto;cursor:default\" role=\"img\" aria-label=\"Drát s ionty a elektrony, který se zahřívá podle výkonu\"><\/canvas>\n<p class=\"mute\" style=\"margin-top:6px\">Šedé tečky jsou ionty mřížky, modré elektrony. Čím víc výkonu se v drátu mění v teplo, tím víc se rozžhaví a ionty víc kmitají.<\/p>\n<canvas id=\"gr\" style=\"height:230px;margin-top:8px;border-radius:12px\" role=\"img\" aria-label=\"Graf napětí a proudu, přímka s odporem jako sklonem\"><\/canvas>\n<div class=\"row\" id=\"mats\"><\/div>\n<label>Délka drátu l: <b id=\"lv\">3<\/b> m<input id=\"len\" type=\"range\" min=\"0.1\" max=\"10\" step=\"0.1\" value=\"3\"><\/label>\n<label>Průřez S: <b id=\"sv\">0,5<\/b> mm²<input id=\"sec\" type=\"range\" min=\"0.1\" max=\"2\" step=\"0.05\" value=\"0.5\"><\/label>\n<label>Napětí zdroje U: <b id=\"uv\">6<\/b> V<input id=\"vol\" type=\"range\" min=\"1\" max=\"12\" step=\"0.5\" value=\"6\"><\/label>\n\n<section class=\"card\">\n<h2>Odpor, proud a teplo<\/h2>\n<p class=\"f\">R = ρ · l / S &nbsp;·&nbsp; U = R · I &nbsp;·&nbsp; P = U · I<\/p>\n<p id=\"read\"><\/p>\n<p class=\"mute\">ρ je měrný odpor materiálu v Ω·mm²/m: kolik ohmů má drát dlouhý 1 m s průřezem 1 mm².<\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Úkol: nastav proud 3 A<\/h2>\n<p>Zvol materiál, rozměry a napětí tak, aby drátem tekl proud asi 3 A. Stačí s odchylkou 0,7 A.<\/p>\n<p id=\"task\" class=\"mute\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Co si odnést<\/h2>\n<ul>\n<li>Odpor roste s délkou a klesá s průřezem: R = ρ · l / S. Dvojnásobný průřez znamená poloviční odpor.<\/li>\n<li>Ohmův zákon U = R · I je v grafu přímka a odpor je její sklon. Platí pro kovy při stálé teplotě, ne pro každou součástku.<\/li>\n<li>V odporu se energie mění v teplo, P = U · I = R · I². Proto je topná spirála z nichromu a vedení z mědi.<\/li>\n<\/ul>\n<\/section>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id),cv=$('stage'),cx=cv.getContext('2d'),gv=$('gr'),gx=gv.getContext('2d');\nconst MAT=[['Měď',.0175],['Hliník',.028],['Železo',.10],['Nichrom',1.10]],GH=230;\nlet W=0,H=0,mat=3,el=[],t0=performance.now();\nconst col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst f=n=>n.toLocaleString('cs-CZ',{maximumSignificantDigits:3});\nconst gl=()=>+$('len').value,gs=()=>+$('sec').value,gu=()=>+$('vol').value,Rr=()=>MAT[mat][1]*gl()/gs(),Lpx=()=>80+(W-120)*(gl()-.1)/9.9,hh=()=>8+26*gs();\nfunction seed(){const n=Math.round(.004*Lpx()*hh());el=[];for(let i=0;i<n;i++)el.push({x:Math.random()*Lpx(),y:(Math.random()-.5)*(hh()-8)})}\nfunction resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);\n gv.width=gv.clientWidth*d;gv.height=GH*d;gx.setTransform(d,0,0,d,0,0);seed()}\nMAT.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m[0];b.setAttribute('aria-pressed',i==mat);b.onclick=()=>{mat=i;[...$('mats').children].forEach((c,j)=>c.setAttribute('aria-pressed',j==i))};$('mats').appendChild(b)});\nfunction step(dt){const I=gu()/Rr(),sp=Math.min(220,40*Math.sqrt(I)),Lp=Lpx(),lim=(hh()-8)/2;\n el.forEach(e=>{e.x-=sp*dt+(Math.random()-.5)*120*dt;e.y=Math.max(-lim,Math.min(lim,e.y+(Math.random()-.5)*120*dt));if(e.x<0)e.x+=Lp;if(e.x>Lp)e.x-=Lp})}\nfunction draw(){cx.clearRect(0,0,W,H);const Lp=Lpx(),h=hh(),x0=20,cy=H/2-6,I=gu()/Rr(),P=gu()*I,ht=Math.min(1,P/60),N=col('--neg'),K=col('--ink');\n cx.save();cx.shadowColor='rgba(255,120,30,'+ht+')';cx.shadowBlur=24*ht;cx.fillStyle='rgba('+(184+71*ht|0)+','+(110-40*ht|0)+','+(30*ht|0)+','+(.16+.5*ht)+')';cx.fillRect(x0,cy-h/2,Lp,h);cx.restore();\n cx.strokeStyle=col('--force');cx.lineWidth=2;cx.strokeRect(x0,cy-h/2,Lp,h);\n cx.fillStyle=K;cx.globalAlpha=.45;const amp=.5+3*ht;\n for(let a=x0+8;a<x0+Lp-4;a+=16)for(let b=cy-h/2+8;b<cy+h/2-4;b+=16){cx.beginPath();cx.arc(a+(Math.random()-.5)*amp*2,b+(Math.random()-.5)*amp*2,3,0,7);cx.fill()}\n cx.globalAlpha=1;cx.fillStyle=N;el.forEach(e=>{cx.beginPath();cx.arc(x0+e.x,cy+e.y,3.2,0,7);cx.fill()});\n cx.font='bold 20px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='alphabetic';cx.fillStyle=col('--pos');cx.fillText('+',x0,cy-h/2-8);cx.fillStyle=N;cx.fillText('−',x0+Lp,cy-h/2-8);\n cx.fillStyle=K;cx.font='13px system-ui,sans-serif';cx.fillText('l = '+f(gl())+' m, S = '+f(gs())+' mm²',x0+Lp/2,cy+h/2+22)}\nfunction graph(){const w=gv.clientWidth,h=GH,m={l:44,r:14,t:14,b:34},pw=w-m.l-m.r,ph=h-m.t-m.b,Xm=5,Ym=12,X=i=>m.l+pw*i/Xm,Y=u=>m.t+ph*(1-u/Ym),R=Rr(),U=gu(),I=U/R,K=col('--ink'),M=col('--mute'),F=col('--force');\n gx.clearRect(0,0,w,h);gx.font='12px system-ui,sans-serif';gx.lineWidth=1;gx.strokeStyle=col('--line');gx.fillStyle=M;gx.textAlign='center';gx.textBaseline='top';\n for(let i=0;i<=Xm;i++){gx.beginPath();gx.moveTo(X(i),Y(0));gx.lineTo(X(i),Y(Ym));gx.stroke();gx.fillText(i,X(i),Y(0)+5)}\n gx.textAlign='right';gx.textBaseline='middle';for(let u=0;u<=Ym;u+=3){gx.beginPath();gx.moveTo(X(0),Y(u));gx.lineTo(X(Xm),Y(u));gx.stroke();gx.fillText(u,X(0)-6,Y(u))}\n gx.fillStyle=K;gx.textAlign='right';gx.textBaseline='bottom';gx.fillText('I (A)',w-m.r,h-2);gx.textAlign='left';gx.textBaseline='top';gx.fillText('U (V)',4,0);\n gx.setLineDash([5,5]);gx.strokeStyle=M;gx.lineWidth=1.5;gx.beginPath();gx.moveTo(X(0),Y(0));gx.lineTo(X(Xm),Y(Xm));gx.stroke();gx.setLineDash([]);gx.fillStyle=M;gx.textAlign='left';gx.textBaseline='bottom';gx.fillText('1 Ω',X(Xm)-30,Y(Xm)-4);\n const Ie=Math.min(Xm,Ym/R);gx.strokeStyle=F;gx.lineWidth=3.5;gx.beginPath();gx.moveTo(X(0),Y(0));gx.lineTo(X(Ie),Y(R*Ie));gx.stroke();\n if(I<=Xm){gx.setLineDash([4,4]);gx.lineWidth=1.5;gx.strokeStyle=K;gx.beginPath();gx.moveTo(X(I),Y(0));gx.lineTo(X(I),Y(U));gx.lineTo(X(0),Y(U));gx.stroke();gx.setLineDash([]);gx.fillStyle=K;gx.beginPath();gx.arc(X(I),Y(U),6,0,7);gx.fill()}\n else{gx.fillStyle=K;gx.textAlign='right';gx.textBaseline='bottom';gx.fillText('I = '+f(I)+' A je mimo graf',X(Xm),Y(U)-4)}}\nfunction ui(){const R=Rr(),U=gu(),I=U/R,P=U*I;$('lv').textContent=f(gl());$('sv').textContent=f(gs());$('uv').textContent=f(U);\n $('read').textContent='R = ρ · l / S = '+f(MAT[mat][1])+' · '+f(gl())+' / '+f(gs())+' = '+f(R)+' Ω. Při napětí '+f(U)+' V teče proud I = U / R = '+f(I)+' A a drát se zahřívá výkonem P = U · I = '+f(P)+' W.'+(I>20?' To je zkrat, v praxi by shořela pojistka.':'');\n $('task').innerHTML=Math.abs(I-3)<.7?'<span class=\"ok\">Splněno! Proud je '+f(I)+' A.<\/span>':'Zatím ne, proud je '+f(I)+' A. Cíl je 3 A, stačí ±0,7 A.'}\n$('len').oninput=$('sec').oninput=seed;\naddEventListener('resize',resize);resize();\n(function loop(t){const dt=Math.min(.03,(t-t0)/1000);t0=t;step(dt);draw();graph();ui();requestAnimationFrame(loop)})(t0);\n<\/script>\n<\/body>\n<\/html>\n","<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Mapa elektřiny – 7. Kirchhoff<\/title>\n<style>\n:root{--bg:#e9eff6;--panel:#fff;--ink:#14213d;--mute:#53647c;--line:#c5d1e0;--pos:#d6304a;--neg:#1f6feb;--force:#b86e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nmain{max-width:760px;margin:0 auto;padding:14px 16px 32px}\nol{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:0 0 6px;margin:0}\nol li{white-space:nowrap;padding:3px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px}\nol li.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}\na{color:inherit;text-decoration:none}\nh1{font:600 30px/1.15 \"Iowan Old Style\",Palatino,Georgia,serif;margin:14px 0 6px}\nh2{font:600 19px/1.2 \"Iowan Old Style\",Palatino,Georgia,serif;margin:0 0 8px}\np{margin:0 0 8px}.mute{color:var(--mute);font-size:14px}\ncanvas{width:100%;display:block;border-radius:14px;background:var(--panel);border:1px solid var(--line)}\n#stage{height:min(56vh,410px);touch-action:none;cursor:crosshair;margin-top:10px}\n#prof{height:110px;margin-top:8px;border-radius:12px}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\nbutton{font:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\nbutton[aria-pressed=\"true\"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}\n:focus-visible{outline:3px solid var(--force);outline-offset:2px}\nlabel{display:block;font-size:15px}input[type=range]{width:100%;min-height:36px;accent-color:var(--force)}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}\n.f{font:600 22px/1.3 \"Iowan Old Style\",Palatino,Georgia,serif}\n.ok{color:var(--force);font-weight:600}\nul{margin:0;padding-left:20px}ul li{margin-bottom:6px}\n<\/style>\n<\/head>\n<body>\n<main>\n\n<h1>Kirchhoffovy zákony<\/h1>\n<p>Dva zákony, které platí v každém obvodu. V uzlu A se proud dělí do dvou větví a při obchůzce kolem smyčky se potenciál vždy vrátí na původní hodnotu.<\/p>\n<canvas id=\"stage\" style=\"height:270px;touch-action:auto;cursor:default\" role=\"img\" aria-label=\"Obvod se zdrojem, rezistorem R1 a dvěma paralelními větvemi R2 a R3\"><\/canvas>\n<p class=\"mute\" style=\"margin-top:6px\">Žluté tečky jsou proud v dohodnutém směru, čím je proud větší, tím rychleji tečou.<\/p>\n<canvas id=\"gr\" style=\"height:190px;margin-top:8px;border-radius:12px\" role=\"img\" aria-label=\"Graf potenciálu při obchůzce kolem smyčky\"><\/canvas>\n<div class=\"row\"><button id=\"l2\" aria-pressed=\"true\">Smyčka přes R₂<\/button><button id=\"l3\" aria-pressed=\"false\">Smyčka přes R₃<\/button><\/div>\n<label>Napětí zdroje U: <b id=\"uv\">9<\/b> V<input id=\"u\" type=\"range\" min=\"1\" max=\"12\" step=\"0.5\" value=\"9\"><\/label>\n<label>Odpor R₁: <b id=\"a\">4<\/b> Ω<input id=\"r1\" type=\"range\" min=\"1\" max=\"20\" step=\"1\" value=\"4\"><\/label>\n<label>Odpor R₂: <b id=\"b\">6<\/b> Ω<input id=\"r2\" type=\"range\" min=\"1\" max=\"20\" step=\"1\" value=\"6\"><\/label>\n<label>Odpor R₃: <b id=\"c\">6<\/b> Ω<input id=\"r3\" type=\"range\" min=\"1\" max=\"20\" step=\"1\" value=\"6\"><\/label>\n\n<section class=\"card\">\n<h2>1. zákon: uzly<\/h2>\n<p class=\"f\">Σ I<sub>do uzlu<\/sub> = Σ I<sub>z uzlu<\/sub><\/p>\n<p id=\"n1\"><\/p>\n<\/section>\n<section class=\"card\">\n<h2>2. zákon: smyčky<\/h2>\n<p class=\"f\">Σ U = 0 &nbsp;(kolem celé smyčky)<\/p>\n<p id=\"n2\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Úkol: třetina proudu<\/h2>\n<p>Nastav odpory tak, aby větví R₂ tekla jen asi třetina celkového proudu. Stačí rozmezí 0,27 až 0,39.<\/p>\n<p id=\"task\" class=\"mute\"><\/p>\n<\/section>\n\n<section class=\"card\">\n<h2>Co si odnést<\/h2>\n<ul>\n<li>Uzlový zákon: co do uzlu vteče, to z něj vyteče. Náboj se v uzlu neztrácí ani nehromadí.<\/li>\n<li>Smyčkový zákon: potenciál je jednoznačná „výška“, takže po okruhu se vždy vrátíš do stejné výšky. Zdroj nahoru, rezistory dolů.<\/li>\n<li>Větev s menším odporem si bere víc proudu. Z obou zákonů dohromady vznikne soustava rovnic, kterou vyřešíš každý obvod.<\/li>\n<\/ul>\n<\/section>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id),cv=$('stage'),cx=cv.getContext('2d'),gv=$('gr'),gx=gv.getContext('2d');\nlet W=0,H=270,GH=190,lp=2,ph=[0,0,0,0],t0=performance.now(),tt=0;\nconst col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst f=n=>(+n.toFixed(6)).toLocaleString('cs-CZ',{maximumSignificantDigits:3}),g=id=>+$(id).value;\nfunction calc(){const U=g('u'),a=g('r1'),b=g('r2'),c=g('r3'),r=b*c/(b+c),I=U/(a+r),U1=I*a,U2=I*r;return{U,a,b,c,I,U1,U2,I2:U2/b,I3:U2/c}}\nfunction lay(){const x0=34,xB=W-44;return{x0,xB,xA:(x0+xB)/2,yT:50,yB:H-50,ym:H/2}}\nfunction pt(p,d){for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l)return[a[0]+(b[0]-a[0])*d/l,a[1]+(b[1]-a[1])*d/l];d-=l}return p[p.length-1]}\nconst len=p=>p.slice(1).reduce((s,q,i)=>s+Math.hypot(q[0]-p[i][0],q[1]-p[i][1]),0);\nfunction resize(){const d=devicePixelRatio||1;W=cv.clientWidth;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);gv.width=gv.clientWidth*d;gv.height=GH*d;gx.setTransform(d,0,0,d,0,0)}\nfunction box(x,y,w,h,t1,t2,K){cx.fillStyle=col('--panel');cx.strokeStyle=K;cx.lineWidth=2;cx.fillRect(x-w/2,y-h/2,w,h);cx.strokeRect(x-w/2,y-h/2,w,h);cx.fillStyle=K;cx.textAlign='center';cx.textBaseline='middle';cx.font='bold 13px system-ui,sans-serif';cx.fillText(t1,x,y-7);cx.font='12px system-ui,sans-serif';cx.fillText(t2,x,y+8)}\nfunction draw(){const c=calc(),{x0,xA,xB,yT,yB,ym}=lay(),K=col('--ink'),F=col('--force'),cur=[c.I,c.I2,c.I3,c.I];\n const P=[[[x0,ym],[x0,yT],[xA,yT]],[[xA,yT],[xA,yB]],[[xA,yT],[xB,yT],[xB,yB],[xA,yB]],[[xA,yB],[x0,yB],[x0,ym]]];\n cx.clearRect(0,0,W,H);cx.lineCap='round';cx.lineJoin='round';\n P.forEach((p,i)=>{cx.beginPath();p.forEach((q,j)=>j?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.strokeStyle=K;cx.globalAlpha=.5;cx.lineWidth=3;cx.stroke();cx.strokeStyle=F;cx.globalAlpha=.22;cx.lineWidth=5+4*Math.sqrt(cur[i]);cx.stroke();cx.globalAlpha=1;\n  cx.fillStyle=F;const L2=len(p);for(let d=ph[i]%22;d<L2;d+=22){const q=pt(p,d);cx.beginPath();cx.arc(q[0],q[1],3.5,0,7);cx.fill()}});\n cx.fillStyle=col('--panel');cx.fillRect(x0-22,ym-18,44,36);cx.strokeStyle=K;cx.lineWidth=3;cx.beginPath();cx.moveTo(x0-14,ym-6);cx.lineTo(x0+14,ym-6);cx.stroke();cx.lineWidth=5;cx.beginPath();cx.moveTo(x0-7,ym+6);cx.lineTo(x0+7,ym+6);cx.stroke();\n cx.fillStyle=K;cx.font='bold 14px system-ui,sans-serif';cx.textAlign='left';cx.textBaseline='middle';cx.fillText('+',x0+18,ym-8);cx.fillText('−',x0+18,ym+8);cx.font='12px system-ui,sans-serif';cx.fillText('U = '+f(c.U)+' V',x0+34,ym);\n box((x0+xA)/2,yT,72,34,'R₁ = '+c.a+' Ω','I = '+f(c.I)+' A',K);box(xA,ym,72,34,'R₂ = '+c.b+' Ω','I₂ = '+f(c.I2)+' A',K);box(xB,ym,72,34,'R₃ = '+c.c+' Ω','I₃ = '+f(c.I3)+' A',K);\n [[xA,yT,'uzel A',-14],[xA,yB,'uzel B',16]].forEach(([x,y,t,o])=>{cx.fillStyle=K;cx.beginPath();cx.arc(x,y,5,0,7);cx.fill();cx.font='12px system-ui,sans-serif';cx.textAlign='center';cx.fillText(t,x,y+o)});\n cx.fillText('I = '+f(c.I)+' A',(x0+xA)/2,yB-12)}\nfunction graph(){const w=gv.clientWidth,c=calc(),m={l:44,r:10,t:16,b:30},pw=w-m.l-m.r,ph2=GH-m.t-m.b,X=i=>m.l+pw*i/3,Y=u=>m.t+ph2*(1-u/12),K=col('--ink'),M=col('--mute'),F=col('--force'),rk=lp==2?'R₂':'R₃';\n const pts=[[0,0],[1,c.U],[2,c.U-c.U1],[3,c.U-c.U1-c.U2]];gx.clearRect(0,0,w,GH);gx.font='12px system-ui,sans-serif';gx.lineWidth=1;gx.strokeStyle=col('--line');gx.fillStyle=M;gx.textAlign='right';gx.textBaseline='middle';\n for(let u=0;u<=12;u+=6){gx.beginPath();gx.moveTo(X(0),Y(u));gx.lineTo(X(3),Y(u));gx.stroke();gx.fillText(u+' V',X(0)-6,Y(u))}\n gx.setLineDash([4,4]);[1,2].forEach(i=>{gx.beginPath();gx.moveTo(X(i),Y(0));gx.lineTo(X(i),Y(12));gx.stroke()});gx.setLineDash([]);\n gx.textAlign='center';gx.textBaseline='top';['zdroj','R₁',rk].forEach((t,i)=>gx.fillText(t,X(i+.5),Y(0)+6));gx.textAlign='left';gx.fillText('potenciál',4,0);\n gx.strokeStyle=F;gx.lineWidth=3.5;gx.lineJoin='round';gx.beginPath();pts.forEach((q,i)=>i?gx.lineTo(X(q[0]),Y(q[1])):gx.moveTo(X(q[0]),Y(q[1])));gx.stroke();\n gx.fillStyle=K;gx.textBaseline='bottom';gx.textAlign='center';[['+'+f(c.U)+' V',.5,c.U/2],['−'+f(c.U1)+' V',1.5,c.U-c.U1/2],['−'+f(c.U2)+' V',2.5,c.U-c.U1-c.U2/2]].forEach(([t,x,u])=>gx.fillText(t,X(x),Y(u)-8));\n const s=(tt*.25%1)*3,i=Math.min(2,s|0),fr=s-i,mx=pts[i][0]+fr,my=pts[i][1]+(pts[i+1][1]-pts[i][1])*fr;gx.beginPath();gx.arc(X(mx),Y(my),6,0,7);gx.fill()}\nfunction ui(){const c=calc();$('uv').textContent=f(c.U);$('a').textContent=c.a;$('b').textContent=c.b;$('c').textContent=c.c;\n $('n1').textContent='Do uzlu A přitéká I = '+f(c.I)+' A a odtéká I₂ + I₃ = '+f(c.I2)+' A + '+f(c.I3)+' A = '+f(c.I2+c.I3)+' A.';\n const k=lp==2?'R₂':'R₃',z=Math.round((c.U-c.U1-c.U2)*1e9)/1e9;$('n2').textContent='Smyčka přes '+k+': +'+f(c.U)+' V (zdroj) − '+f(c.U1)+' V (R₁) − '+f(c.U2)+' V ('+k+') = '+f(z)+' V.';\n const r=c.I2/c.I;$('task').innerHTML=r>.27&&r<.39?'<span class=\"ok\">Splněno! Větví R₂ teče '+f(r*100)+' % proudu.<\/span>':'Zatím ne, větví R₂ teče '+f(r*100)+' % proudu. Cíl je asi 33 %.'}\nfunction setL(n){lp=n;$('l2').setAttribute('aria-pressed',n==2);$('l3').setAttribute('aria-pressed',n==3)}\n$('l2').onclick=()=>setL(2);$('l3').onclick=()=>setL(3);\naddEventListener('resize',resize);resize();\n(function loop(t){const dt=Math.min(.03,(t-t0)/1000);t0=t;tt+=dt;const c=calc();[c.I,c.I2,c.I3,c.I].forEach((v,i)=>ph[i]+=Math.min(160,12+25*v)*dt);draw();graph();ui();requestAnimationFrame(loop)})(t0);\n<\/script>\n<\/body>\n<\/html>\n","<!doctype html>\n<html lang=\"cs\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Mapa elektřiny – 8. Zákony<\/title>\n<style>\n:root{--bg:#e9eff6;--panel:#fff;--ink:#14213d;--mute:#53647c;--line:#c5d1e0;--pos:#d6304a;--neg:#1f6feb;--force:#b86e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#0e1a2e;--panel:#16243b;--ink:#e6edf7;--mute:#9fb0c8;--line:#2a3c58;--pos:#ff6b81;--neg:#5aa2ff;--force:#ffb938;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nmain{max-width:760px;margin:0 auto;padding:14px 16px 32px}\nol{display:flex;gap:6px;overflow-x:auto;list-style:none;padding:0 0 6px;margin:0}\nol li{white-space:nowrap;padding:3px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13px}\nol li.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}\na{color:inherit;text-decoration:none}\nh1{font:600 30px/1.15 \"Iowan Old Style\",Palatino,Georgia,serif;margin:14px 0 6px}\nh2{font:600 19px/1.2 \"Iowan Old Style\",Palatino,Georgia,serif;margin:0 0 8px}\np{margin:0 0 8px}.mute{color:var(--mute);font-size:14px}\ncanvas{width:100%;display:block;border-radius:14px;background:var(--panel);border:1px solid var(--line)}\n#stage{height:min(56vh,410px);touch-action:none;cursor:crosshair;margin-top:10px}\n#prof{height:110px;margin-top:8px;border-radius:12px}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\nbutton{font:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}\nbutton[aria-pressed=\"true\"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}\n:focus-visible{outline:3px solid var(--force);outline-offset:2px}\nlabel{display:block;font-size:15px}input[type=range]{width:100%;min-height:36px;accent-color:var(--force)}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}\n.f{font:600 22px/1.3 \"Iowan Old Style\",Palatino,Georgia,serif}\n.ok{color:var(--force);font-weight:600}\nul{margin:0;padding-left:20px}ul li{margin-bottom:6px}\n<\/style>\n<style>[hidden]{display:none!important}<\/style><\/head>\n<body>\n<main>\n\n<h1>Síň zákonů<\/h1>\n<p>Vyber zákon. U každého je vzorec a věta o tom, co říká. U těch nových je i pokus, který si můžeš sám vyzkoušet.<\/p>\n<div class=\"row\" id=\"chips\"><\/div>\n<section class=\"card\"><h2 id=\"ttl\"><\/h2><p class=\"f\" id=\"fm\"><\/p><p id=\"tx\"><\/p><p id=\"lkp\" hidden><a id=\"lk\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:underline\"><\/a><\/p><\/section>\n<canvas id=\"stage\" style=\"height:300px;margin-top:12px;touch-action:none\" role=\"img\" aria-label=\"Pokus k vybranému zákonu\"><\/canvas>\n<label id=\"slw\" hidden>Proud I: <b id=\"slv\">5<\/b> A<input id=\"sl\" type=\"range\" min=\"-10\" max=\"10\" step=\"1\" value=\"5\"><\/label>\n<p id=\"rd\" class=\"mute\" style=\"margin-top:8px\"><\/p>\n<section class=\"card\">\n<h2>Souvislosti<\/h2>\n<ul>\n<li>Coulomb a Gauss jsou dvě podoby téhož: sílu mezi náboji i tok pole ven z plochy určuje náboj.<\/li>\n<li>Ohm, Joule a Kirchhoff spolu řeší každý obvod: napětí, proud, teplo.<\/li>\n<li>Ampère a Faraday ukazují, že elektřina a magnetismus jsou jedna věc. Maxwell dodá chybějící kus a vyjde světlo.<\/li>\n<\/ul>\n<\/section>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id),cv=$('stage'),cx=cv.getContext('2d'),B='https://claude.ai/artifact/';\nconst LAWS=[\n['Coulomb','F = k · |q₁ · q₂| / r²','Stejné náboje se odpuzují, opačné přitahují, a síla klesá s druhou mocninou vzdálenosti.','naboj','zastávka 1 Náboj',0],\n['Ohm','U = R · I','Proud je úměrný napětí. Odpor je sklon přímky v grafu napětí a proudu.','odpor','zastávka 6 Odpor',0],\n['Joule','P = U · I = R · I²','Elektrická energie se v odporu mění v teplo. Dvojnásobný proud znamená čtyřnásobný ohřev.','odpor','zastávka 6 Odpor',0],\n['Kirchhoff','Σ I = 0 v uzlu &nbsp;·&nbsp; Σ U = 0 ve smyčce','Náboj se v uzlu neztrácí a po obchůzce smyčky se potenciál vrátí na původní hodnotu.','kirchhoff','zastávka 7 Kirchhoff',0],\n['Gauss','Φ = Q<sub>uvnitř<\/sub> / ε₀','Kolik siločar vyjde ven uzavřenou plochou, závisí jen na náboji uvnitř. Kde přesně leží, je jedno. Táhni oběma náboji.','','',1],\n['Ampère','∮ B · dl = μ₀ · I','Proud kolem sebe vytváří magnetické pole, které ho obtáčí. Směr určuje pravidlo pravé ruky. Táhni měřicí bod.','','',2],\n['Faraday a Lenz','U<sub>ind<\/sub> = −dΦ / dt','Měnící se magnetický tok vyvolá ve smyčce napětí. Mínus je Lenzovo pravidlo: indukovaný proud brání změně, která ho vyvolala. Táhni magnetem.','','',3],\n['Maxwell','c = 1 / √(μ₀ · ε₀)','Měnící se elektrické pole vytváří magnetické a naopak. Z toho vznikne vlna, která se šíří rychlostí světla: je to světlo.','','',4]];\nlet W=0,H=300,cur=0,drag=null,tt=0,t0=performance.now(),gA,gB,probe,mag,gl=[],gd=true,gOut=0,gIn=0,phiP=0,em=0,hist=[];\nconst col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));\nconst f=n=>(+n.toFixed(6)).toLocaleString('cs-CZ',{maximumSignificantDigits:3});\nfunction init(){gA={x:W*.38,y:H*.5};gB={x:W*.85,y:H*.3};probe={x:W*.5+100,y:H*.5-30};mag={x:W*.15,y:H*.5};gd=true;hist=[]}\nfunction resize(){const d=devicePixelRatio||1;W=cv.clientWidth;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);init()}\nfunction show(i){cur=i;const L=LAWS[i],d=L[5];$('ttl').textContent=L[0];$('fm').innerHTML=L[1];$('tx').textContent=L[2];$('lkp').hidden=!L[3];if(L[3]){$('lk').href='#'+L[3];$('lk').removeAttribute('target');$('lk').onclick=ev=>{ev.preventDefault();parent.go(L[3])};$('lk').textContent='Vyzkoušej v zastávce: '+L[4]+' →'}\n cv.hidden=!d;$('slw').hidden=d!=2;[...$('chips').children].forEach((b,j)=>b.setAttribute('aria-pressed',j==i));$('rd').textContent='';if(d)resize()}\nLAWS.forEach((L,i)=>{const b=document.createElement('button');b.textContent=L[0];b.onclick=()=>show(i);$('chips').appendChild(b)});\nfunction gE(x,y){let ex=0,ey=0;[[gA,1],[gB,-1]].forEach(([c,q])=>{const dx=x-c.x,dy=y-c.y,d2=dx*dx+dy*dy+25,d=Math.sqrt(d2);ex+=q*dx/(d2*d);ey+=q*dy/(d2*d)});return[ex,ey]}\nfunction gBuild(){gl=[];let o=0,n=0;const R=80,cX=W*.38,cY=H*.5,ins=(x,y)=>Math.hypot(x-cX,y-cY)<R;\n for(let k=0;k<16;k++){const a=6.2832*(k+.5)/16;let x=gA.x+Math.cos(a)*8,y=gA.y+Math.sin(a)*8,w=ins(x,y);const p=[[x,y]];\n  for(let i=0;i<2500;i++){const e=gE(x,y),m=Math.hypot(e[0],e[1])+1e-12;x+=e[0]/m*3;y+=e[1]/m*3;p.push([x,y]);const w2=ins(x,y);if(w&&!w2)o++;if(!w&&w2)n++;w=w2;if(Math.hypot(x-gB.x,y-gB.y)<9||Math.abs(x)>3*W||Math.abs(y)>3*H)break}\n  gl.push(p)}gOut=o;gIn=n;gd=false}\nfunction dGa(){if(gd)gBuild();const K=col('--ink'),P=col('--pos'),N=col('--neg'),cX=W*.38,cY=H*.5,R=80;\n cx.strokeStyle=K;cx.globalAlpha=.55;cx.lineWidth=1.5;gl.forEach(p=>{cx.beginPath();p.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke()});cx.globalAlpha=1;\n cx.setLineDash([7,5]);cx.strokeStyle=col('--force');cx.lineWidth=3;cx.beginPath();cx.arc(cX,cY,R,0,7);cx.stroke();cx.setLineDash([]);\n [[gA,P,'+'],[gB,N,'−']].forEach(([c,k,s])=>{cx.fillStyle=k;cx.beginPath();cx.arc(c.x,c.y,13,0,7);cx.fill();cx.fillStyle='#fff';cx.font='bold 18px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(s,c.x,c.y+1)});\n const Q=(Math.hypot(gA.x-cX,gA.y-cY)<R?1:0)-(Math.hypot(gB.x-cX,gB.y-cY)<R?1:0);\n $('rd').textContent='Čar ven − čar dovnitř = '+gOut+' − '+gIn+' = '+(gOut-gIn)+'. Uvnitř plochy je celkem náboj '+Q+' Q, takže tok je úměrný '+Q+'. Čar je 16 na jednotkový náboj.'}\nfunction dAm(){const I=+$('sl').value,x0=W/2,y0=H/2,K=col('--ink'),F=col('--force'),s=Math.sign(I);$('slv').textContent=I;\n cx.lineWidth=1.5;[40,80,120,160].forEach(r=>{cx.strokeStyle=K;cx.globalAlpha=.3;cx.beginPath();cx.arc(x0,y0,r,0,7);cx.stroke();cx.globalAlpha=1;\n  if(s)for(let k=0;k<6;k++){const a=k*1.0472-s*tt*.5,px=x0+r*Math.cos(a),py=y0+r*Math.sin(a),tx=s*Math.sin(a),ty=-s*Math.cos(a);cx.fillStyle=F;cx.beginPath();cx.moveTo(px+tx*9,py+ty*9);cx.lineTo(px-tx*5-ty*6,py-ty*5+tx*6);cx.lineTo(px-tx*5+ty*6,py-ty*5-tx*6);cx.fill()}});\n cx.fillStyle=col('--panel');cx.strokeStyle=K;cx.lineWidth=3;cx.beginPath();cx.arc(x0,y0,15,0,7);cx.fill();cx.stroke();cx.fillStyle=K;\n if(s>0){cx.beginPath();cx.arc(x0,y0,4,0,7);cx.fill()}if(s<0){cx.beginPath();cx.moveTo(x0-7,y0-7);cx.lineTo(x0+7,y0+7);cx.moveTo(x0+7,y0-7);cx.lineTo(x0-7,y0+7);cx.stroke()}\n const dx=probe.x-x0,dy=probe.y-y0,r=Math.max(20,Math.hypot(dx,dy)),a=Math.atan2(dy,dx),tx=s*Math.sin(a),ty=-s*Math.cos(a);\n cx.fillStyle=F;cx.beginPath();cx.arc(probe.x,probe.y,8,0,7);cx.fill();if(s){cx.strokeStyle=K;cx.lineWidth=3;cx.beginPath();cx.moveTo(probe.x,probe.y);cx.lineTo(probe.x+tx*34,probe.y+ty*34);cx.stroke()}\n $('rd').textContent='I = '+I+' A ('+(I>0?'směrem k tobě, z obrazovky':I<0?'od tebe, do obrazovky':'žádný proud')+'). V bodě '+f(r/10)+' cm od vodiče je B = μ₀I / (2πr) = '+f(200*Math.abs(I)/r)+' µT'+(s?', siločáry se točí '+(s>0?'proti':'po')+' směru hodinových ručiček.':'.')}\nfunction dFa(dt){const xc=W/2,cy=H*.5,ph=Math.exp(-(((mag.x-xc)/70)**2)),raw=-(ph-phiP)/Math.max(dt,.001);phiP=ph;em=em*.85+raw*.15;hist.push(em);if(hist.length>200)hist.shift();\n const K=col('--ink'),F=col('--force'),P=col('--pos'),N=col('--neg'),cl=v=>clamp(v,-1,1);\n cx.strokeStyle=F;cx.lineWidth=4;cx.beginPath();cx.ellipse(xc,cy,12,56,0,0,7);cx.stroke();\n mag.y=cy;cx.fillStyle=P;cx.fillRect(mag.x-34,cy-14,34,28);cx.fillStyle=N;cx.fillRect(mag.x,cy-14,34,28);cx.fillStyle='#fff';cx.font='bold 16px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('N',mag.x-17,cy+1);cx.fillText('S',mag.x+17,cy+1);\n const mx=W-62,my=84,th=cl(em/3)*1.2;cx.strokeStyle=K;cx.lineWidth=2;cx.beginPath();cx.arc(mx,my,46,Math.PI,0);cx.stroke();cx.lineWidth=3;cx.strokeStyle=F;cx.beginPath();cx.moveTo(mx,my);cx.lineTo(mx+44*Math.sin(th),my-44*Math.cos(th));cx.stroke();cx.fillStyle=K;cx.font='12px system-ui,sans-serif';cx.fillText('U = '+f(em*40)+' mV',mx,my+14);\n const by=H-40;cx.strokeStyle=col('--line');cx.lineWidth=1;cx.beginPath();cx.moveTo(0,by);cx.lineTo(W,by);cx.stroke();cx.strokeStyle=F;cx.lineWidth=2.5;cx.beginPath();hist.forEach((v,i)=>{const x=i/200*W,y=by-cl(v/3)*32;i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.stroke();cx.fillStyle=K;cx.textAlign='left';cx.fillText('napětí v čase',6,by-34);\n $('rd').textContent=em<-.4?'Magnet se blíží, tok roste. Indukovaný proud vytvoří opačné pole a magnet odpuzuje (Lenz).':em>.4?'Magnet se vzdaluje, tok klesá. Proud se ho snaží udržet a magnet přitahuje zpět (Lenz).':'Magnet stojí nebo je daleko: tok se nemění, napětí je nulové.'}\nfunction dMa(){const cy=H*.5,K=col('--ink'),F=col('--force'),N=col('--neg'),c=1/Math.sqrt(1.25664e-6*8.8542e-12);\n cx.strokeStyle=K;cx.lineWidth=1.5;cx.globalAlpha=.4;cx.beginPath();cx.moveTo(0,cy);cx.lineTo(W,cy);cx.stroke();cx.globalAlpha=1;\n [[F,0],[N,1]].forEach(([k,m])=>{cx.strokeStyle=k;cx.lineWidth=3;cx.beginPath();for(let x=0;x<=W;x+=4){const v=70*Math.sin(.035*x-2.2*tt),X=m?x+.5*v:x,Y=m?cy+.4*v:cy-v;x?cx.lineTo(X,Y):cx.moveTo(X,Y)}cx.stroke()});\n cx.font='bold 14px system-ui,sans-serif';cx.textAlign='left';cx.fillStyle=F;cx.fillText('E: elektrické pole (nahoru a dolů)',8,22);cx.fillStyle=N;cx.fillText('B: magnetické pole (šikmo, kolmo na E)',8,42);cx.fillStyle=K;cx.fillText('směr šíření →',W-120,H-14);\n $('rd').textContent='Rychlost vlny vychází jen z konstant: c = 1 / √(μ₀ε₀) = '+(c/1e8).toFixed(3).replace('.',',')+' × 10⁸ m/s, tedy rychlost světla.'}\nconst DEM=[null,dGa,dAm,dFa,dMa];\ncv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,d=LAWS[cur][5];let o=null;\n if(d==1)o=[gA,gB].find(p=>Math.hypot(p.x-x,p.y-y)<24);if(d==2&&Math.hypot(probe.x-x,probe.y-y)<26)o=probe;if(d==3&&Math.abs(mag.x-x)<44&&Math.abs(mag.y-y)<34)o=mag;\n if(o){drag=o;cv.setPointerCapture(e.pointerId)}});\ncv.addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;\n if(drag===mag)drag.x=clamp(x,34,W-34);else{drag.x=clamp(x,14,W-14);drag.y=clamp(y,14,H-14)}if(drag===gA||drag===gB)gd=true});\n['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drag=null));\naddEventListener('resize',()=>{if(!cv.hidden)resize()});show(0);\n(function loop(t){const dt=Math.min(.05,(t-t0)/1000);t0=t;tt+=dt;const d=LAWS[cur][5];if(d&&W){cx.clearRect(0,0,W,H);DEM[d](dt)}requestAnimationFrame(loop)})(t0);\n<\/script>\n<\/body>\n<\/html>\n"];

N.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n[1];b.onclick=()=>go(i);$('nb').appendChild(b)});
function fit(f){try{f.style.height=Math.ceil(f.contentDocument.body.getBoundingClientRect().height)+2+'px'}catch(e){}}
function go(n){const i=typeof n==='number'?n:N.findIndex(x=>x[0]===n);if(i<0||i===cur)return;cur=i;
 const f=document.createElement('iframe');f.title=N[i][1];f.setAttribute('scrolling','no');f.style.height='1400px';f.srcdoc=M[i];
 f.onload=()=>{fit(f);try{new ResizeObserver(()=>fit(f)).observe(f.contentDocument.body)}catch(e){}};
 $('v').replaceChildren(f);
 [...$('nb').children].forEach((b,j)=>{b.setAttribute('aria-current',j==i);if(j==i)$('nb').scrollLeft=b.offsetLeft-60});
 $('pv').hidden=i==0;$('nx').hidden=i==N.length-1;
 if(location.hash.slice(1)!==N[i][0])location.hash=N[i][0];window.scrollTo(0,0)}
$('pv').onclick=()=>go(cur-1);$('nx').onclick=()=>go(cur+1);
addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(Math.max(0,N.findIndex(x=>x[0]===location.hash.slice(1))));
</script>
</body>
</html>
